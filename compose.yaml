services:
  app:
    image: adrobot:local
    build: .
    ports:
      - "127.0.0.1:${ADROBOT_PORT:-8765}:8765"
    env_file:
      - path: .env
        required: false
    environment:
      APP_MODE: live
      KEITARO_BASE_URL: ${KEITARO_BASE_URL:-https://tlgk.host}
      KEITARO_API_KEY: ${KEITARO_API_KEY:-}
      DATABASE_URL: sqlite:////data/adrobot.db
    volumes:
      - adrobot-data:/data
    init: true
volumes:
  adrobot-data:
